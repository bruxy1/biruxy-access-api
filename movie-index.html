<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BIRUXY MOVIE</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:linear-gradient(135deg,#08001c,#001b35);color:#fff;min-height:100vh}header{padding:22px;text-align:center;background:#0006;position:sticky;top:0;z-index:5}.logo{font-size:30px;font-weight:900;color:#00eaff;letter-spacing:3px}.wrap{max-width:1150px;margin:auto;padding:28px 18px}.card{background:#ffffff12;border:1px solid #ffffff20;border-radius:20px;padding:22px}.hidden{display:none!important}.input{width:100%;padding:15px;border:0;border-radius:12px;margin:8px 0;font-size:16px}button{border:0;border-radius:12px;padding:13px 18px;font-weight:800;cursor:pointer;background:#00eaff;color:#001018;margin:5px}.ghost{background:#ffffff18;color:#fff}.danger{background:#ff4d6d;color:#fff}#login{max-width:500px;margin:13vh auto;text-align:center}.tabs{text-align:center;margin:20px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px}.movie{padding:0;overflow:hidden}.movie img{width:100%;height:270px;object-fit:cover;background:#111}.movie .p{padding:15px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}video{width:100%;max-height:70vh;background:#000;border-radius:16px}@media(max-width:700px){.row{grid-template-columns:1fr}.movie img{height:230px}}</style></head><body><header><div class="logo">BIRUXY MOVIE</div></header><div class="wrap">
<section id="login" class="card"><h1>Enter Username</h1><p>Use the username generated by ADUNLOCK.</p><input id="key" class="input" placeholder="USER-XXXXXXXX"><button onclick="login()">LOGIN</button><p id="loginMsg"></p><button class="ghost" onclick="location.href='https://biruxy-movies.onrender.com'">GET USERNAME</button></section>
<section id="home" class="hidden"><div class="card"><h1>Welcome to BIRUXY 🎬</h1><div class="tabs"><button id="mt" onclick="cat('movies')">MOVIES</button><button id="pt" onclick="cat('private')">PRIVATE</button><button class="ghost" onclick="admin()">ADMIN</button></div></div><div id="list" class="grid" style="margin-top:20px"></div><div id="player" class="card hidden" style="margin-top:20px"><h2 id="ptitle"></h2><p id="pdesc"></p><video id="vid" controls playsinline></video></div></section>
<section id="admin" class="hidden"><div class="card"><h1>🔐 Admin Panel</h1><div id="alog"><input id="au" class="input" placeholder="Admin username"><input id="ap" type="password" class="input" placeholder="Admin password"><button onclick="alogin()">LOGIN</button><p id="amsg"></p></div><div id="dash" class="hidden"><div class="row"><input id="title" class="input" placeholder="Movie title"><select id="category" class="input"><option value="movies">MOVIES</option><option value="private">PRIVATE</option></select></div><textarea id="desc" class="input" rows="4" placeholder="Description"></textarea><div class="row"><input id="poster" class="input" type="file" accept="image/*"><input id="videoFile" class="input" type="file" accept="video/*"></div><input id="posterUrl" class="input" placeholder="Poster URL (optional)"><input id="videoUrl" class="input" placeholder="Direct video URL (optional)"><button onclick="add()">UPLOAD MOVIE</button><button class="ghost" onclick="location.reload()">LOGOUT</button><p id="addmsg"></p><h2>Uploaded Movies</h2><div id="alist"></div></div><button class="ghost" onclick="home()">← BACK</button></div></section></div>
<script>const API='https://biruxy-access-api.onrender.com';let ms=[],category='movies',token=localStorage.getItem('biruxy_admin_token')||'';const $=x=>document.getElementById(x);function show(x){['login','home','admin'].forEach(y=>$(y).classList.add('hidden'));$(x).classList.remove('hidden')}async function login(){let k=$('key').value.trim().toUpperCase();$('loginMsg').textContent='Checking...';try{let r=await fetch(API+'/api/keys/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:k})}),d=await r.json();if(!r.ok)throw Error(d.error);show('home');load()}catch(e){$('loginMsg').textContent=e.message}}async function load(){ms=await (await fetch(API+'/api/movies')).json();render()}function cat(c){category=c;render()}function render(){let a=ms.filter(m=>m.category===category);$('mt').style.background=category==='movies'?'#00eaff':'';$('pt').style.background=category==='private'?'#ff2bd6':'';$('list').innerHTML=a.length?a.map(m=>`<div class="movie card"><img src="${esc(m.poster||'')}" onerror="this.style.display='none'"><div class="p"><h3>${esc(m.title)}</h3><small>${esc(m.description||'')}</small><br><button onclick="watch('${m.id}')">WATCH</button></div></div>`).join(''):'<div class="card">No movies added yet.</div>'}function watch(id){let m=ms.find(x=>x.id===id);$('ptitle').textContent=m.title;$('pdesc').textContent=m.description||'';$('vid').src=m.video;$('vid').load();$('player').classList.remove('hidden');window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}function admin(){show('admin')}function home(){show('home');load()}async function alogin(){let r=await fetch(API+'/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('au').value,password:$('ap').value})}),d=await r.json();if(!r.ok){$('amsg').textContent=d.error;return}token=d.token;localStorage.setItem('biruxy_admin_token',token);$('alog').classList.add('hidden');$('dash').classList.remove('hidden');alist()}async function alist(){ms=await (await fetch(API+'/api/movies')).json();$('alist').innerHTML=ms.map(m=>`<div class="card" style="margin:10px 0"><b>${esc(m.title)}</b> — ${m.category}<button class="danger" onclick="delm('${m.id}')">DELETE</button></div>`).join('')||'No movies.';render()}async function add(){let f=new FormData();f.append('title',$('title').value);f.append('description',$('desc').value);f.append('category',$('category').value);f.append('posterUrl',$('posterUrl').value);f.append('videoUrl',$('videoUrl').value);if($('poster').files[0])f.append('poster',$('poster').files[0]);if($('videoFile').files[0])f.append('video',$('videoFile').files[0]);$('addmsg').textContent='Uploading...';let r=await fetch(API+'/api/movies',{method:'POST',headers:{Authorization:'Bearer '+token},body:f}),d=await r.json();if(!r.ok){$('addmsg').textContent=d.error;return}$('addmsg').textContent='Movie uploaded successfully.';['title','desc','posterUrl','videoUrl'].forEach(x=>$(x).value='');$('poster').value='';$('videoFile').value='';alist()}async function delm(id){if(confirm('Delete this movie?')){await fetch(API+'/api/movies/'+id,{method:'DELETE',headers:{Authorization:'Bearer '+token}});alist()}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}let q=new URLSearchParams(location.search).get('key');if(q){$('key').value=q;login()}</script></body></html>
